<!DOCTYPE html>

<style>

#stage{position:absolute;inset:0}canvas{display:block}
.fx{position:fixed;pointer-events:none}

.gp .r{display:flex;justify-content:space-between;gap:8px;margin:3px 0;color:#9fb6c8}.gp .r b{color:var(--fg);text-align:right}
.bg{height:8px;background:#16222c;margin:10px 0 4px}.bg i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--ok))}
.v{font-size:clamp(15px,2.4vw,22px);font-weight:700;color:var(--ok)}.n{color:var(--acc);margin-top:4px}
.ob{position:absolute;border:1.5px solid var(--acc);box-shadow:0 0 10px rgba(55,215,255,.5),inset 0 0 10px rgba(55,215,255,.3);opacity:0;transition:opacity .25s}

</style></head><body>
<div id="stage"></div>
<div class="fx bar t"></div><div class="fx bar b"></div>
<div id="hud">
 <div id="ocr"></div>
 <div class="tl"><div class="tt">AMR-07 // 3PL FULFILLMENT // SIMULATION</div><div id="st">NAVIGATING</div></div>
 <div class="gp" id="gp"><h4>VACUUM CONTROL</h4>
  <div class="r"><span>MATERIAL</span><b id="gm"></b></div><div class="r"><span>CONFIDENCE</span><b id="gc"></b></div>
  <div class="r"><span>EST. MASS</span><b id="gw"></b></div><div class="r"><span>TARGET</span><b id="gt"></b></div>

 <div class="bl" id="tel"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=p=>{p=clamp(p);return p*p*(3-2*p)};
const sine=p=>.5-.5*Math.cos(Math.PI*clamp(p));
const lerp=(a,b,k)=>a+(b-a)*k;
const TIP=.37,T=38,STOP=.4,XS=-10,XE=17;

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
$('stage').appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x07090c);scene.fog=new THREE.FogExp2(0x0a0e14,.02);
const cam=new THREE.PerspectiveCamera(42,1,.05,150);

// environment reflections
const es=new THREE.Scene();
es.add(new THREE.Mesh(new THREE.SphereGeometry(50,16,8),new THREE.MeshBasicMaterial({color:0x1b222b,side:THREE.BackSide})));
for(let i=0;i<8;i++){const m=new THREE.Mesh(new THREE.BoxGeometry(14,.3,1.2),new THREE.MeshBasicMaterial({color:new THREE.Color(1,1,1).multiplyScalar(6)}));m.position.set(i*8-28,20,i%2?6:-6);es.add(m)}
scene.environment=new THREE.PMREMGenerator(renderer).fromScene(es,.04).texture;

const M=(c,r,m,o)=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:r,metalness:m},o||{}));
const G=new THREE.BoxGeometry(1,1,1);
function bx(w,h,d,mat,x,y,z,par,sh){const o=new THREE.Mesh(G,mat);o.scale.set(w,h,d);o.position.set(x,y,z);o.castShadow=o.receiveShadow=sh!==false;(par||scene).add(o);return o}

// floor
const nc=document.createElement('canvas');nc.width=nc.height=256;const ng=nc.getContext('2d');ng.fillStyle='#808080';ng.fillRect(0,0,256,256);
for(let i=0;i<6000;i++){const v=90+Math.random()*80|0;ng.fillStyle=`rgba(${v},${v},${v},.35)`;ng.fillRect(Math.random()*256,Math.random()*256,2,2)}
const nt=new THREE.CanvasTexture(nc);nt.wrapS=nt.wrapT=THREE.RepeatWrapping;nt.repeat.set(50,13);nt.encoding=THREE.sRGBEncoding;
const floor=new THREE.Mesh(new THREE.PlaneGeometry(100,26),M(0x2b2e34,.36,.15,{map:nt}));
floor.rotation.x=-Math.PI/2;floor.position.x=-3;floor.receiveShadow=true;scene.add(floor);
const yel=M(0xffc400,.5,0,{emissive:0x553d00,emissiveIntensity:.8});
const flat=(w,d,mat,x,z)=>{const p=new THREE.Mesh(new THREE.PlaneGeometry(w,d),mat);p.rotation.x=-Math.PI/2;p.position.set(x,.006,z);p.receiveShadow=true;scene.add(p)};
flat(52,.14,yel,-2,0);flat(52,.06,yel,-2,1.4);flat(52,.06,yel,-2,-1.4);
flat(3.2,2.2,new THREE.MeshBasicMaterial({color:0x20d080,transparent:true,opacity:.22}),17.3,0);

// shell: walls, roof, dock
const wallM=M(0x0e1116,.9,.1);
[[-12],[12]].forEach(([z])=>bx(90,10,.5,wallM,-3,5,z,0,false));
bx(.6,9,26,wallM,-30,4.5,0,0,false);bx(90,.4,26,wallM,-3,8,0,0,false);
bx(.6,9,26,M(0x1a1d22,.9,.2),24.3,4.5,0,0,false);
[-6,0,6].forEach(z=>bx(.1,3.4,4,M(0x0a0a0a,.6,.3,{emissive:0x3a9cff,emissiveIntensity:1.2}),23.9,1.8,z,0,false));
const sc2=document.createElement('canvas');sc2.width=1024;sc2.height=200;const sg=sc2.getContext('2d');sg.fillStyle='#0b1218';sg.fillRect(0,0,1024,200);
sg.fillStyle='#37d7ff';sg.font='bold 110px monospace';sg.textAlign='center';sg.fillText('DISPATCH 03',512,135);
const sign=new THREE.Mesh(new THREE.PlaneGeometry(6,1.17),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(sc2),toneMapped:false}));
sign.rotation.y=-Math.PI/2;sign.position.set(23.85,5.2,0);scene.add(sign);
const mBrown=M(0xb98c58,.85,0),mDark=M(0x14181d,.5,.7);
[-3.3,3.3].forEach(z=>{bx(4.5,.45,1.1,mDark,19.8,.225,z);for(let i=0;i<3;i++)bx(.5,.4,.5,mBrown,18.6+i*1.3,.65,z)});

// racks
const mUp=M(0x1b4f9c,.5,.6),mBeam=M(0xff7a18,.45,.5),mDeck=M(0x2b2f36,.7,.5);
const X0=-24,X1=13.5,LV=[.2,1.2,2.2,3.2,4.2],ZF=1.7,ZB=2.7,L=X1-X0,CX=(X0+X1)/2;
for(const s of[-1,1]){
 LV.forEach(y=>{bx(L,.1,.06,mBeam,CX,y-.07,s*(ZF+.03));bx(L,.1,.06,mBeam,CX,y-.07,s*(ZB-.03));bx(L,.04,ZB-ZF-.06,mDeck,CX,y-.02,s*(ZF+ZB)/2)});
 for(let k=0;k<=15;k++)[ZF+.03,ZB-.03].forEach(z=>bx(.08,5,.08,mUp,X0+k*2.5,2.5,s*z));
}
const pk=[];
for(const s of[-1,1])for(const lv of LV.slice(0,4))for(let x=X0+.4;x<X1-.3;){
 const w=.35+Math.random()*.3,h=.25+Math.random()*.3,d=.35+Math.random()*.3,cx=x+w/2;
 if(Math.random()<.18){x+=.5;continue}
 if(s<0&&lv===1.2&&Math.abs(cx)<.75){x+=.9;continue}
 pk.push([cx,lv+h/2,s*(ZF+.1+d/2),w,h,d,Math.random()]);x+=w+.08+Math.random()*.2}
const inst=new THREE.InstancedMesh(G,M(0xffffff,.8,0),pk.length),dm=new THREE.Object3D(),col=new THREE.Color();
pk.forEach((q,i)=>{dm.position.set(q[0],q[1],q[2]);dm.scale.set(q[3],q[4],q[5]);dm.updateMatrix();inst.setMatrixAt(i,dm.matrix);
 q[6]<.8?col.setHSL(.075+q[6]*.03,.45,.26+q[6]*.2):col.setHSL(.58,.06,.68);inst.setColorAt(i,col)});
inst.castShadow=inst.receiveShadow=true;scene.add(inst);

// robot
const robot=new THREE.Group();scene.add(robot);
const mShell=M(0xf4f7fa,.22,.15),mBlue=M(0x1b6fd1,.4,.3),mGlow=new THREE.MeshBasicMaterial({color:0x37d7ff}),mBin=M(0x2b5d94,.5,.2),mSteel=M(0xb8c0c8,.3,.9);
bx(1.5,.16,.86,mDark,0,.27,0,robot);bx(1.46,.24,.9,mShell,0,.47,0,robot);bx(1.5,.04,.92,mDark,0,.61,0,robot);
[-1,1].forEach(s=>bx(1.2,.025,.01,mGlow,0,.47,s*.452,robot,false));
bx(.04,.1,.7,mDark,.74,.4,0,robot);
const lid=new THREE.Mesh(new THREE.CylinderGeometry(.08,.08,.1,20),mDark);lid.position.set(.62,.68,0);robot.add(lid);
const lidR=new THREE.Mesh(new THREE.CylinderGeometry(.082,.082,.015,20),mGlow);lidR.position.set(.62,.73,0);robot.add(lidR);
bx(.3,.01,.05,new THREE.MeshBasicMaterial({color:0xffc400}),.6,.1,0,robot,false);
const WG=new THREE.CylinderGeometry(.17,.17,.12,24),wh=[];
[[.5,.5],[.5,-.5],[-.5,.5],[-.5,-.5]].forEach(([x,z])=>{const g=new THREE.Group();g.position.set(x,.17,z);const m=new THREE.Mesh(WG,mDark);m.rotation.x=Math.PI/2;m.castShadow=true;g.add(m);bx(.2,.04,.13,mBlue,0,0,0,g,false);robot.add(g);wh.push(g)});
bx(.7,.03,.76,mBin,.3,.645,0,robot);bx(.03,.3,.76,mBin,-.05,.8,0,robot);bx(.03,.3,.76,mBin,.65,.8,0,robot);bx(.7,.3,.03,mBin,.3,.8,.38,robot);bx(.7,.3,.03,mBin,.3,.8,-.38,robot);
bx(.12,1.75,.14,mDark,-.4,1.5,0,robot);bx(.02,1.7,.02,mBlue,-.4,1.5,.08,robot,false);
const mastO=new THREE.Object3D();mastO.position.set(-.4,0,0);robot.add(mastO);
const yawG=new THREE.Group();mastO.add(yawG);const car=new THREE.Group();yawG.add(car);
bx(.2,.2,.2,mShell,0,0,0,car);bx(.13,.13,.62,mShell,0,0,-.31,car);
const ext=new THREE.Group();car.add(ext);
const rod=bx(.07,.07,1,mSteel,0,0,0,ext);
const cupG=new THREE.Group();cupG.position.z=-.3;ext.add(cupG);
const bel=new THREE.Mesh(new THREE.CylinderGeometry(.04,.12,.06,20),M(0x20262d,.8,0));bel.rotation.x=Math.PI/2;bel.position.z=-.04;cupG.add(bel);
const ringM=M(0x111111,.4,0,{emissive:0x37d7ff,emissiveIntensity:.6});
const ring=new THREE.Mesh(new THREE.TorusGeometry(.11,.012,8,24),ringM);ring.position.z=-.07;cupG.add(ring);
bx(.16,.1,.16,mDark,0,.16,-.14,car);
const lens=new THREE.Mesh(new THREE.CylinderGeometry(.035,.035,.03,16),mGlow);lens.rotation.x=Math.PI/2;lens.position.set(0,.16,-.235);car.add(lens);
const lensO=new THREE.Object3D();lensO.position.set(0,.16,-.25);car.add(lensO);
const lensL=new THREE.PointLight(0x37d7ff,.3,3);lensL.position.copy(lensO.position);car.add(lensL);
const under=new THREE.PointLight(0x37d7ff,.7,3.5);under.position.set(0,.12,0);robot.add(under);

// package
const matBody=M(0xb98c58,.85,0),matLab=new THREE.MeshStandardMaterial({roughness:.6});
const pbox=new THREE.Mesh(G,[matBody,matBody,matBody,matBody,matLab,matBody]);pbox.castShadow=true;scene.add(pbox);
const lc=document.createElement('canvas');lc.width=lc.height=512;const lg=lc.getContext('2d');
const lt=new THREE.CanvasTexture(lc);lt.encoding=THREE.sRGBEncoding;matLab.map=lt;
const TYPES=[
 {n:'CORRUGATED BOX',W:.5,H:.42,D:.5,col:0xb98c58,r:.85,kpa:62,conf:98.2,mass:1.8,note:'RIGID SURFACE / HIGH-FLOW SEAL'},
 {n:'POLY MAILER',W:.42,H:.5,D:.14,col:0xdde5ee,r:.22,kpa:28,conf:96.7,mass:.4,note:'FLEXIBLE FILM / LOW-FLOW SEAL'}];
let cyc=0;
function applyType(){const ty=TYPES[cyc%2];pbox.scale.set(ty.W,ty.H,ty.D);matBody.color.setHex(ty.col);matBody.roughness=ty.r;
 lg.fillStyle='#'+new THREE.Color(ty.col).getHexString();lg.fillRect(0,0,512,512);lg.fillStyle='#fff';lg.fillRect(40,50,432,412);
 lg.fillStyle='#111';lg.font='bold 34px monospace';lg.fillText('ACME 3PL  PRIORITY',60,95);
 lg.font='28px monospace';lg.fillText('SHIP TO: R. MEHTA',60,170);lg.fillText('14 HARBOUR ROAD',60,205);lg.fillText('CHENNAI 600001 IN',60,240);
 for(let x=70;x<440;){const w=2+(Math.random()*7|0);lg.fillRect(x,260,w,110);x+=w+2+(Math.random()*5|0)}
 lg.font='24px monospace';lg.fillText('0092 4417 55'+(30+cyc%60),130,396);lg.font='bold 30px monospace';lg.fillText('SKU AMR-4471-'+(cyc%2?'B':'A'),60,442);lt.needsUpdate=true}
let boxSt=-1;
function setBoxState(s){const ty=TYPES[cyc%2];
 if(s===0){scene.add(pbox);pbox.position.set(0,1.2+ty.H/2,-(1.8+ty.D/2));pbox.rotation.set(0,0,0)}
 else if(s===1){ext.add(pbox);pbox.position.set(0,0,-(TIP+ty.D/2));pbox.rotation.set(0,0,0)}
 else robot.attach(pbox)}

// scan visuals
const tg=new THREE.BufferGeometry();tg.setAttribute('position',new THREE.BufferAttribute(new Float32Array(9),3));
const tri=new THREE.Mesh(tg,new THREE.MeshBasicMaterial({color:0x37d7ff,transparent:true,opacity:.14,blending:THREE.AdditiveBlending,side:THREE.DoubleSide,depthWrite:false}));
const tril=new THREE.LineLoop(tg,new THREE.LineBasicMaterial({color:0x7ee8ff,transparent:true,opacity:.8}));
tri.frustumCulled=tril.frustumCulled=false;
const sheet=new THREE.Mesh(new THREE.PlaneGeometry(1,.02),new THREE.MeshBasicMaterial({color:0x7ee8ff,blending:THREE.AdditiveBlending,transparent:true,toneMapped:false}));
scene.add(tri,tril,sheet);

// lights
scene.add(new THREE.HemisphereLight(0x9fc4ee,0x222428,.55));
const sun=new THREE.DirectionalLight(0xdfeaff,.9);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);
const sh=sun.shadow.camera;sh.left=sh.bottom=-7;sh.right=sh.top=7;sh.near=1;sh.far=25;scene.add(sun,sun.target);
const pl=new THREE.PointLight(0xaed4ff,1.1,9,2);scene.add(pl);
const dl=new THREE.PointLight(0x3a9cff,1.4,14,2);dl.position.set(21,3,0);scene.add(dl);

// camera keys: [t, px,py,pz (rel robot x), tx,ty,tz, fov]
const K=[[0,3.2,.45,.85,0,.45,0,46],[4.5,-.8,.55,1.25,1.2,.5,0,42],[9,-2.2,1.25,1.2,-.5,1.2,-1,38],[11,.5,1.62,-.35,-.4,1.45,-1.8,30],
 [14.5,.35,1.6,-.6,-.4,1.45,-1.8,28],[17,.7,1.55,-.9,-.4,1.42,-1.75,30],[19,1.6,1.8,1.3,-.3,1.05,0,40],[22.5,.6,1.95,1,0,.85,0,38],
 [25,-2.4,1.2,.7,1,.6,0,42],[29,-3.4,1.1,.25,2,.55,0,44],[34,-3.8,2,0,3,.5,0,46],[38,-5.5,2.8,0,4,.4,0,50]];
const dp=new THREE.Vector3(),dt3=new THREE.Vector3(),lk=new THREE.Vector3();let fov=42,snap=true;

// HUD
const ST=[[9,'NAVIGATING // LINE-FOLLOW'],[15,'SCANNING // OCR + MATERIAL ID'],[18.2,'PICKING // VACUUM SEAL'],[23,'TRANSFER // ONBOARD BIN'],[25,'STOWED // CLEARING SHELF'],[36.4,'TRANSIT // DISPATCH DOCK 03'],[99,'ARRIVED // DOCK 03']];
const OC=[{u:.1,v:.25,w:.8,h:.25,t0:11.8,l:()=>'ADDRESS 99.1%'},{u:.12,v:.5,w:.76,h:.24,t0:12.8,l:()=>'CODE128 OK'},{u:.1,v:.8,w:.65,h:.09,t0:13.8,l:()=>'SKU AMR-4471-'+(cyc%2?'B':'A')}];
const oe=OC.map(d=>{const e=document.createElement('div');e.className='ob';e.innerHTML='<b>'+d.l()+'</b>';$('ocr').appendChild(e);return e});
const va=new THREE.Vector3(),vb=new THREE.Vector3();let speed=0;

function update(t,dt,play){
 const ty=TYPES[cyc%2];
 const R=t<9?lerp(XS,STOP,sine(t/9)):t<25?STOP:lerp(STOP,XE,sine((t-25)/13));
 const dx=R-robot.position.x;robot.position.x=R;if(dt>0)speed=lerp(speed,Math.abs(dx)/dt,.1);
 wh.forEach(w=>w.rotation.z-=dx/.17);
 const hT=1.2+ty.H/2,hB=.66+ty.H/2+.02,eC=1.8-TIP,eK=.7-TIP-ty.D/2;
 let h=1.1;if(t<11.5)h=lerp(1.1,hT,ease((t-9.5)/2));else if(t<21.5)h=hT;else if(t<22.7)h=lerp(hT,hB,ease((t-21.5)/1.2));else if(t<23.2)h=hB;else h=lerp(hB,1.1,ease((t-23.2)/1));
 let e=0;if(t<18.2)e=lerp(0,eC,ease((t-15)/2.3));else if(t<20)e=lerp(eC,eK,ease((t-18.2)/1.8));else if(t<23.3)e=eK;else e=lerp(eK,0,ease((t-23.3)/1));
 let yaw=0;if(t>=20&&t<21.5)yaw=lerp(0,-Math.PI/2,ease((t-20)/1.5));else if(t>=21.5&&t<24.3)yaw=-Math.PI/2;else if(t>=24.3)yaw=lerp(-Math.PI/2,0,ease((t-24.3)/1.2));
 car.position.y=h;ext.position.z=-e;yawG.rotation.y=yaw;rod.scale.z=e+.3;rod.position.z=(e-.3)/2;
 let p=0;if(t>=16.4&&t<22.8)p=ty.kpa*ease((t-16.4)/1)+(t>17.5?(Math.random()-.5)*.3:0);else if(t>=22.8&&t<23.4)p=ty.kpa*(1-ease((t-22.8)/.6));
 ringM.emissive.setHex(p>1?0x35ff9a:0x37d7ff);ringM.emissiveIntensity=.5+p/ty.kpa*1.6;
 sun.position.set(R+2,9,3);sun.target.position.set(R,0,0);pl.position.set(R,2.6,0);
 scene.updateMatrixWorld(true);
 const st=t<17.3?0:t<23?1:2;if(st!==boxSt){boxSt=st;setBoxState(st)}
 // scan
 const scn=t>11.4&&t<14.6&&boxSt===0;tri.visible=tril.visible=sheet.visible=scn;lensL.intensity=scn?1.6:.35;
 if(scn){const k=(t-11.4)/1.6,w=Math.abs(((k%2)+2)%2-1),yy=1.2+ty.H*w,xm=R-.4,z=-1.79;
  lensO.getWorldPosition(va);const a=tg.attributes.position;
  a.setXYZ(0,va.x,va.y,va.z);a.setXYZ(1,xm-ty.W/2,yy,z);a.setXYZ(2,xm+ty.W/2,yy,z);a.needsUpdate=true;
  sheet.position.set(xm,yy,z);sheet.scale.set(ty.W,1,1)}
 // camera
 let i=0;while(i<K.length-2&&t>=K[i+1][0])i++;const A=K[i],B=K[i+1],k=ease((t-A[0])/(B[0]-A[0])),g=j=>lerp(A[j],B[j],k);
 dp.set(R+g(1)+Math.sin(t*.9)*.03,g(2)+Math.sin(t*1.3)*.015,g(3));dt3.set(R+g(4),g(5),g(6));
 const f=g(7),a=1-Math.exp(-dt*5);
 if(snap){cam.position.copy(dp);lk.copy(dt3);fov=f;snap=false}else{cam.position.lerp(dp,a);lk.lerp(dt3,a);fov=lerp(fov,f,a)}
 cam.lookAt(lk);cam.fov=fov*(cam.aspect<1?1.5:1);cam.updateProjectionMatrix();cam.updateMatrixWorld();
 // HUD
 const vis=t>11.8&&t<18,w=innerWidth,hh=innerHeight;
 OC.forEach((d,n)=>{const el=oe[n];if(!vis||t<d.t0){el.style.opacity=0;return}
  va.set(d.u-.5,.5-d.v,.5);vb.set(d.u+d.w-.5,.5-d.v-d.h,.5);pbox.localToWorld(va);pbox.localToWorld(vb);va.project(cam);vb.project(cam);
  if(va.z>1||vb.z>1){el.style.opacity=0;return}
  const x1=(va.x*.5+.5)*w,y1=(-va.y*.5+.5)*hh,x2=(vb.x*.5+.5)*w,y2=(-vb.y*.5+.5)*hh;
  el.style.left=Math.min(x1,x2)+'px';el.style.top=Math.min(y1,y2)+'px';el.style.width=Math.abs(x2-x1)+'px';el.style.height=Math.abs(y2-y1)+'px';el.style.opacity=1});
 $('st').textContent=ST.find(s=>t<s[0])[1];
 const sg=t>13.4&&t<23.8;$('gp').style.opacity=sg?1:0;
 if(sg){$('gm').textContent=ty.n;$('gc').textContent=ty.conf+'%';$('gw').textContent='~'+ty.mass+' kg';$('gt').textContent='\u2212'+ty.kpa+' kPa';
  $('gv').textContent=(p>.05?'\u2212'+p.toFixed(1):'0.0')+' kPa';$('gb').style.width=clamp(p/70)*100+'%';$('gn').textContent=ty.note}
 $('tel').textContent='SPD '+speed.toFixed(2)+' m/s  |  LINE ERR \u00b1'+(1+(Math.random()*2|0))+' mm  |  CYCLE '+String(cyc+1).padStart(3,'0');
 $('fade').style.opacity=t<.7?1-t/.7:t>T-.8?(t-(T-.8))/.8:0;
}

function rs(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix()}
addEventListener('resize',rs);rs();
let last=performance.now(),playing=true,tt=0;
function newCycle(){applyType();boxSt=-1;snap=true}
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;
 if(playing){tt+=dt;if(tt>=T){tt-=T;cyc++;newCycle()}}
 update(tt,playing?dt:0);renderer.render(scene,cam)}
newCycle();requestAnimationFrame(frame);
const tp=()=>{playing=!playing;$('bp').textContent=playing?'Pause':'Play'};
$('bp').onclick=tp;$('br').onclick=()=>{tt=0;newCycle()};
$('bh').onclick=()=>{const hd=$('hud').style.display==='none';$('hud').style.display=hd?'':'none';$('bh').textContent=hd?'Hide HUD':'Show HUD'};
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();tp()}});
</script></body></html>
